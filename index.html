<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Future Games</title>
<meta name="description" content="Mobile games by Simple Future AB.">
<style>
	:root { color-scheme: light dark; --bg: #ffffff; --fg: #1d2330; --muted: #5b6475; --accent: #2a6fdb; --card: #f2f4f8; }
	@media (prefers-color-scheme: dark) {
		:root { --bg: #151a26; --fg: #e6e9f0; --muted: #a3abbd; --accent: #7aa8ff; --card: #1f2636; }
	}
	body { margin: 0; background: var(--bg); color: var(--fg);
		font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
	main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; }
	h1 { font-size: 2em; line-height: 1.2; margin: 0 0 4px; }
	h2 { font-size: 1.25em; margin: 0 0 4px; }
	p { margin: 0.5em 0; }
	.muted { color: var(--muted); }
	.card { background: var(--card); border-radius: 16px; padding: 20px; margin: 32px 0; }
	a { color: var(--accent); }
</style>
</head>
<body>
<main>
<h1>Simple Future Games</h1>
<p class="muted">Mobile games by Simple Future AB</p>

<div class="card">
	<h2>Quiver Pop: Arrow Puzzle</h2>
	<p>Tap the arrows to slide them off the board. Three of a color clear, so keep the tray from filling up.
		Coming soon to Google Play.</p>
	<p><a href="quiverpop-privacy/">Privacy policy</a></p>
</div>

<p>Contact: <a href="mailto:info@simplefuture.se">info@simplefuture.se</a></p>
</main>
</body>
</html>
